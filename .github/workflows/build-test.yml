name: Build & Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Clamor.sln

      - name: Build
        run: dotnet build Clamor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Clamor.sln --configuration Release --no-build --verbosity normal
